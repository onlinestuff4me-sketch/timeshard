<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&display=swap">
<style>
  * { box-sizing:border-box; margin:0; }
  html, body { width:1200px; height:630px; overflow:hidden; background:#0c0d10; }
  .card { position:relative; width:1200px; height:630px; overflow:hidden; }
  .shot { position:absolute; inset:0; background:url('frame.png') 62% 44% / 126% no-repeat;
          filter:saturate(1.15) contrast(1.06); }
  /* the corridor is nearly white, so the type needs a ground of its own —
     a scrim weighted to the left, where the lockup sits */
  .scrim { position:absolute; inset:0;
           background:linear-gradient(100deg, rgba(8,9,11,.94) 0%, rgba(8,9,11,.86) 34%,
                      rgba(8,9,11,.42) 58%, rgba(8,9,11,.10) 78%, rgba(8,9,11,.30) 100%); }
  .vig { position:absolute; inset:0; box-shadow:inset 0 0 190px 40px rgba(8,9,11,.62); }
  .lock { position:absolute; left:74px; top:50%; transform:translateY(-50%);
          width:660px; color:#eef0f3;
          font-family:"Archivo", ui-sans-serif, system-ui, sans-serif; }
  .eyebrow { font-size:19px; font-weight:700; letter-spacing:.34em; color:#ff3b26;
             margin-bottom:20px; }
  h1 { font-size:118px; line-height:.84; font-weight:900; letter-spacing:-.028em;
       font-variation-settings:"wdth" 116; text-transform:uppercase; }
  h1 em { font-style:normal; display:block; color:#ff3b26; }
  p { margin-top:26px; font-size:31px; line-height:1.28; font-weight:600; color:#d2d7de;
      max-width:19ch; font-variation-settings:"wdth" 104; }
  .url { position:absolute; left:76px; bottom:52px; font-family:"Archivo",sans-serif;
         font-size:21px; font-weight:800; letter-spacing:.20em; color:#8b93a0; }
  /* one shard, borrowed from the game's own geometry, holding the right edge */
  .shard { position:absolute; right:96px; top:50%; width:150px; height:150px;
           transform:translateY(-50%) rotate(-14deg); }
</style></head><body>
<div class="card">
  <div class="shot"></div>
  <div class="scrim"></div>
  <div class="vig"></div>
  <div class="lock">
    <div class="eyebrow">PLAY FREE IN YOUR BROWSER</div>
    <h1>TIME<em>SHATTER</em></h1>
    <p>Stop time. Shoot. Shatter.</p>
  </div>
  <div class="url">TIMESHATTER.APP</div>
</div>
</body></html>
