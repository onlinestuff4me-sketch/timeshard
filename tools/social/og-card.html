<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&display=swap">
<style>
  * { box-sizing:border-box; margin:0; }
  html, body { width:1200px; height:630px; overflow:hidden; background:#0c0d10; }
  .card { position:relative; width:1200px; height:630px; overflow:hidden; }
  /* THE CORRIDOR SITS RIGHT OF CENTRE. A lower background-position-x shows
     more of the frame's left, which pushes the vanishing point rightwards —
     so the type has a dark left half to live on and the picture is a corridor
     rather than a wall. */
  .shot { position:absolute; inset:0; background:url('frame.png') 16% 46% / 142% no-repeat;
          filter:saturate(1.18) contrast(1.08); }
  /* the corridor is nearly white, so the type needs a ground of its own —
     a scrim weighted to the left, where the lockup sits */
  .scrim { position:absolute; inset:0;
           background:linear-gradient(100deg, rgba(8,9,11,.94) 0%, rgba(8,9,11,.86) 34%,
                      rgba(8,9,11,.42) 58%, rgba(8,9,11,.10) 78%, rgba(8,9,11,.30) 100%); }
  .vig { position:absolute; inset:0; box-shadow:inset 0 0 190px 40px rgba(8,9,11,.62); }
  .lock { position:absolute; left:74px; top:50%; transform:translateY(-52%);
          width:640px; color:#eef0f3;
          font-family:"Archivo", ui-sans-serif, system-ui, sans-serif; }
  h1 { font-size:112px; line-height:.86; font-weight:900; letter-spacing:-.028em;
       font-variation-settings:"wdth" 116; text-transform:uppercase; }
  /* SHATTER is the app's own faceted wordmark, dropped in whole. Its intrinsic
     width/height are the menu's, so they are overridden here and the aspect
     comes from the viewBox. */
  #mark { display:block; margin-top:12px; }
  #mark svg { display:block; width:566px; height:auto; overflow:visible; }
  p { margin-top:30px; font-size:30px; line-height:1.25; font-weight:600; color:#d5dae1;
      white-space:nowrap; font-variation-settings:"wdth" 102; }
  /* the utility line: one quiet row at the foot, where a caption belongs.
     It used to be a red eyebrow ABOVE the title, which put the least
     important words on the card in the most prominent place on it. */
  .foot { position:absolute; left:76px; bottom:48px; font-family:"Archivo",sans-serif;
          font-size:19px; font-weight:800; letter-spacing:.19em; color:#98a0ad;
          display:flex; align-items:center; gap:14px; }
  .foot b { color:#e4e8ed; font-weight:800; }
  .foot i { font-style:normal; color:#ff3b26; }
</style></head><body>
<div class="card">
  <div class="shot"></div>
  <div class="scrim"></div>
  <div class="vig"></div>
  <div class="lock">
    <h1>TIME</h1>
    <div id="mark"></div>
    <p>Stop time. Shoot. Shatter.</p>
  </div>
  <div class="foot"><b>TIMESHATTER.APP</b><i>&bull;</i>FREE IN YOUR BROWSER</div>
</div>
</body></html>
